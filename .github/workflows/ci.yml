name: TriGyna CI & Security Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: npm --prefix apps/api ci

      - name: Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://api.trigyna.in/api/v1"
          NEXT_PUBLIC_SITE_URL: "https://www.trigyna.in"
          NEXT_PUBLIC_ENABLE_TEST_LOGIN: "false"

      - name: Backend Security & Hardening Test Suite
        run: node apps/api/src/tests/testSecurityHardeningMaster.js

      - name: Transactional Email & Webhook Unit Tests
        run: node apps/api/src/tests/testResendUnitSuite.js

      - name: Automated Secret Leak & Credential Scanner
        run: node apps/api/src/scripts/comprehensive-security-scanner.js --ci

